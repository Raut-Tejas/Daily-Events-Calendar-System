{% extends "base.html" %}
{% block title %}Edit event — Daymark{% endblock %}

{% block content %}
<section class="form-page">
    <a class="back-link" href="{{ url_for('events.view_events') }}">← Back to my events</a>
    <div class="form-intro">
        <p class="eyebrow">UPDATE YOUR DETAILS</p>
        <h1>Keep it <span>up to date.</span></h1>
        <p>Make changes to this event below.</p>
    </div>

    <form class="event-form" method="POST">
        <div class="form-field">
            <label for="title">Event name <span class="required">*</span></label>
            <input id="title" type="text" name="title" maxlength="150" value="{{ event.title }}" required>
        </div>

        <div class="form-field">
            <label for="event_type">Category <span class="required">*</span></label>
            <select id="event_type" name="event_type" required>
                {% for category in ['Festival', 'National Holiday', 'Birthday', 'Anniversary', 'Personal', 'College', 'Other'] %}
                    <option value="{{ category }}" {% if event.event_type == category %}selected{% endif %}>{{ category }}</option>
                {% endfor %}
                {% if event.event_type not in ['Festival', 'National Holiday', 'Birthday', 'Anniversary', 'Personal', 'College', 'Other'] %}
                    <option value="{{ event.event_type }}" selected>{{ event.event_type }}</option>
                {% endif %}
            </select>
        </div>

        <div class="form-field">
            <label for="event_date">Event date <span class="required">*</span></label>
            <input id="event_date" type="date" name="event_date" value="{{ event.event_date.isoformat() }}" required>
        </div>

        <div class="form-field">
            <label for="description">A few details <span class="optional">(optional)</span></label>
            <textarea id="description" name="description" rows="4">{{ event.description or '' }}</textarea>
        </div>

        <div class="form-actions">
            <a class="button button-quiet" href="{{ url_for('events.view_events') }}">Cancel</a>
            <button class="button button-primary" type="submit">Save changes <span aria-hidden="true">→</span></button>
        </div>
    </form>
</section>
{% endblock %}
